name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'src/**'
      - 'animations/**'
      - 'tests/**'
      - 'images/**'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      # No build step, but stage the site in its own folder: deploying from ./
      # also copies the deploy action's temp folder into itself, and the
      # recursion overflows the path limit.
      - name: Stage site
        run: rsync -a --exclude .git --exclude .github --exclude _site ./ _site/

      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto