# Checks the site on every PR; on pushes to main (or manual dispatch) publishes it
# to the root of the gh-pages branch, which GitHub Pages serves. PR previews live
# in gh-pages/pr-preview/ (see preview.yml), so the publish leaves that folder alone.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Syntax-check JavaScript
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Stage outside ./ so the deploy action's temp folder isn't copied into itself.
      # .nojekyll: serve files as they are, without a Jekyll build.
      - name: Stage site
        run: |
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
