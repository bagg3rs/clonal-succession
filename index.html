<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clonal succession: a walk through Bruce Baguley's idea</title>
<!--
  Front page of bagg3rs.github.io/clonal-succession.
  Quotes are from Bruce Baguley's memoir draft (unpublished), pp. 209-211.
  Self-contained: no network requests. The simulations use invented numbers, not data.
-->
<style>
  :root {
    --bg: #0d1117; --panel: #151b24; --ink: #e6edf3; --dim: #8b949e;
    --rule: #232c38; --accent: #4cc9f0; --quote: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr);
    height: 100vh; }
  .stage { position: relative; border-right: 1px solid var(--rule); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 16px; top: 14px; font: 12px/1.4 Menlo, monospace;
    color: var(--dim); letter-spacing: .04em; text-transform: uppercase; }
  .legend { position: absolute; left: 16px; bottom: 14px; font: 12px/1.6 Menlo, monospace;
    color: var(--dim); max-width: 70%; }
  .side { display: flex; flex-direction: column; padding: 28px 30px 18px; overflow-y: auto; }
  .step { font: 12px Menlo, monospace; color: var(--dim); letter-spacing: .05em; }
  h1 { font-weight: normal; font-size: 30px; line-height: 1.2; margin: 10px 0 18px; }
  .body p { font-size: 17px; line-height: 1.55; margin: 0 0 14px; }
  blockquote { margin: 6px 0 18px; padding: 2px 0 2px 16px; border-left: 3px solid var(--quote);
    font-style: italic; font-size: 17.5px; line-height: 1.55; color: #f3e6c4; }
  blockquote cite { display: block; margin-top: 6px; font-style: normal; font-size: 12px;
    font-family: Menlo, monospace; color: var(--dim); }
  .readout { font: 13px/1.6 Menlo, monospace; color: var(--accent); min-height: 1.6em;
    margin: 4px 0 12px; }
  .nav { margin-top: auto; padding-top: 16px; display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--rule); }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 6px; padding: 8px 14px; font: 14px Menlo, monospace; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 6px; flex: 1; justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); cursor: pointer; }
  .dot.on { background: var(--accent); }
  .foot { font: 11px/1.5 Menlo, monospace; color: #5c6672; margin-top: 10px; }
  a { color: var(--accent); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46vh auto; height: auto; min-height: 100vh; }
    .stage { border-right: none; border-bottom: 1px solid var(--rule); height: 46vh; }
    .side { padding: 20px 18px 14px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="tag" id="tag"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="side">
    <div class="step" id="step"></div>
    <h1 id="title"></h1>
    <div class="body" id="body"></div>
    <div class="readout" id="readout"></div>
    <div class="nav">
      <button id="prev" aria-label="Previous">&larr;</button>
      <button id="play" aria-label="Pause animation">Pause</button>
      <button id="narrate" aria-pressed="false" title="Read each step aloud and move on by itself">Narrate</button>
      <div class="dots" id="dots"></div>
      <button id="next" aria-label="Next">&rarr;</button>
    </div>
    <div class="foot">The moving pictures are illustrations with invented numbers, not measurements.
      Arrow keys move between steps, space pauses. Narrate reads each step aloud using your
      device's own voice and moves on by itself; press it again to stop.
      <a href="v1.html">Earlier version of this site</a> &middot;
      <a href="https://github.com/bagg3rs/clonal-succession">Project on GitHub</a></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Scenes: words from the book, plus captions ---------- */

  var SCENES = [
    {
      title: "More questions than answers",
      tag: "Where it starts",
      sim: { mode: "succession", tumour: true, warm: 220, quiet: true },
      legend: "",
      body:
        '<blockquote>The question that must be answered now is why? What has changed?' +
        '<cite>Bruce Baguley, memoir draft, p. 209</cite></blockquote>' +
        '<p>Bruce Baguley is a cancer researcher in Auckland. For years he and Elaine Marshall grew cells taken straight from patients\' tumours. ' +
        'Those cells did not behave like the cell lines labs grow from them. ' +
        'Some samples were full of dividing cells and some had almost none.</p>' +
        '<p>This is a walk through the idea he built from that, and where it has got to.</p>'
    },
    {
      title: "How healthy tissue renews itself",
      tag: "Healthy tissue",
      sim: { mode: "succession", tumour: false, warm: 0 },
      legend: "Rings are stem cells. Bright cells are dividing. Each colour is one stem cell's family (a clone).",
      body:
        '<blockquote>If you follow one particular stem cell, it produces a clone of cells and then eventually ' +
        'all those cells differentiate, and they sustain that tissue until they start to run out. ' +
        'When that happens, another stem cell sparks into life.' +
        '<cite>Bruce Baguley, memoir draft, p. 209</cite></blockquote>' +
        '<p>Watch one ring light up. Its family grows, the cells settle into their working form, ' +
        'then they age and die. As they thin out, another stem cell takes over.</p>'
    },
    {
      title: "The usual picture of a tumour",
      tag: "The commonly accepted view",
      sim: { mode: "immortal", tumour: true, warm: 0 },
      legend: "One family that keeps dividing and never dies.",
      body:
        '<blockquote>This idea of immortalisation has become commonly accepted, the notion that tumour cells ' +
        'are different from normal cells because they mutate and continue to divide forever.' +
        '<cite>Bruce Baguley, memoir draft, p. 210</cite></blockquote>' +
        '<p>In this picture one mutated family takes over and carries on for good. ' +
        'Find what drives it and you know what you are treating.</p>'
    },
    {
      title: "Bruce's idea: a relay of clones",
      tag: "Clonal succession",
      sim: { mode: "succession", tumour: true, warm: 120, strip: true },
      legend: "Hollow cells are tumour cells that did not finish differentiating. The strip below shows which family holds the tumour over time.",
      body:
        '<blockquote>The samples of the patients showed that the tumour cells actually behave more like normal tissue, ' +
        'which means that they are in fact mortal and won\'t reproduce forever. But because of stem cells within the tumour ' +
        '&hellip; there is a clonal succession in the tumour.' +
        '<cite>Bruce Baguley, memoir draft, p. 210</cite></blockquote>' +
        '<p>The tumour cells still die out. They just do not finish turning into working tissue, ' +
        'and new families keep taking over. Elaine put the result simply:</p>' +
        '<blockquote>We found that tumours are not composed of one cell lineage.' +
        '<cite>Elaine Marshall, in Bruce Baguley\'s memoir draft, p. 209</cite></blockquote>'
    },
    {
      title: "Why the same drug can work, then not",
      tag: "Treatment",
      sim: { mode: "succession", tumour: true, warm: 160, strip: true, drug: true },
      legend: "Every few seconds a dose (white ring) removes most of the cells that are dividing at that moment.",
      body:
        '<blockquote>Some samples may be dominated by cells that show as proliferating rapidly, and they are the ones ' +
        'seemingly sensitive to all drugs.' +
        '<cite>Bruce Baguley, memoir draft, p. 211</cite></blockquote>' +
        '<p>Here the drug only hits cells that are dividing. Dose a tumour while a family is growing ' +
        'and it looks sensitive. Dose it in a quiet spell and it looks resistant. Nothing about the drug changed.</p>' +
        '<blockquote>We can\'t assume that what works on one colony of cells will work on the next.' +
        '<cite>Bruce Baguley, memoir draft, p. 210</cite></blockquote>'
    },
    {
      title: "It depends when you take the sample",
      tag: "The surgical sample",
      sim: { mode: "succession", tumour: true, warm: 200, strip: true, sample: true },
      legend: "Each marker on the strip is a sample. The number is the share of cells dividing at that moment.",
      body:
        '<blockquote>We need to pay attention to the stage that the tumour is in when we take the surgical sample. ' +
        'Sometimes it will be in its actively growing phase, other times the cell will have almost petered out.' +
        '<cite>Bruce Baguley, memoir draft, p. 211</cite></blockquote>' +
        '<p>Same tumour, same rules, very different readings depending on the day. ' +
        'That matches the spread Bruce saw across Elaine\'s samples.</p>'
    },
    {
      title: "What wakes the next stem cell?",
      tag: "The open question",
      sim: { mode: "succession", tumour: true, warm: 140, question: true },
      legend: "The pulsing rings are dormant stem cells waiting their turn.",
      body:
        '<blockquote>If we can get a mathematical grasp on it, this idea of alternating rates of proliferation of cells, ' +
        'we can develop a model that would help us understand the whole process better.' +
        '<cite>Bruce Baguley, memoir draft, p. 211</cite></blockquote>' +
        '<p>The model we built from his description works. The part nobody knows is what tells a sleeping stem cell ' +
        'that its turn has come. It could be a signal sent to each one, or a change in something they all draw on.</p>' +
        '<p>With a billion cells, a signal sent to each stem cell has a long way to travel. ' +
        'That is the problem Bruce raised in March.</p>'
    },
    {
      title: "The ovary picks one at a time",
      tag: "Bruce's comparison",
      sim: { mode: "ovary" },
      legend: "Circles are follicles. The bar is FSH, the dashed line the level a follicle needs to be picked.",
      body:
        '<p>The notes from an early call have Bruce comparing the stem cell niche to the ovary. ' +
        'This year he asked whether the signal is like the one that follows fertilisation.</p>' +
        '<p>The ovary does pick one at a time, without messaging the others. ' +
        'In a 2026 model of it, FSH rises until it crosses a threshold. One follicle is picked at random. ' +
        'It makes oestradiol, which pulls FSH back down, and the rest fall below what they need.</p>' +
        '<p>Now and then the window does not shut fast enough and two are picked. That is how the model explains twins.</p>'
    },
    {
      title: "So which is it in a tumour?",
      tag: "Where it stands",
      sim: { mode: "succession", tumour: true, warm: 260, quiet: true, strip: true },
      legend: "",
      body:
        '<blockquote>For me this theory is very interesting, but the problem is how do you prove it, ' +
        'particularly using limited resources?' +
        '<cite>Bruce Baguley, memoir draft, p. 211</cite></blockquote>' +
        '<p>The question back to Bruce is: is it a signal sent to each stem cell, or a signal that changes something ' +
        'they all draw on? His answer decides which rule goes into the model next.</p>' +
        '<p>If it is the second, the ovary model suggests a test: how often two families start at the same time.</p>' +
        '<p>This needs more people than the two of us. If you work on stem cells, tumour biology or modelling, or know someone who does, ' +
        '<a href="https://github.com/bagg3rs/clonal-succession/issues">get in touch on GitHub</a>.</p>'
    }
  ];

  /* ---------- Shared bits ---------- */

  var COLORS = ["#4cc9f0", "#f72585", "#ffd166", "#06d6a0", "#b892ff", "#ff8c42"];
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 0, H = 0, DPR = 1;
  var playing = !reduceMotion;
  var current = 0;
  var sim = null;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function fit() {
    DPR = window.devicePixelRatio || 1;
    var r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---------- Cell field simulation ---------- */

  var R = 8.4;               // disc radius in grid units
  var SLOTS = [], STEM_SLOTS = [];
  (function buildGrid() {
    var rows = Math.ceil(R / 0.866) + 1;
    for (var j = -rows; j <= rows; j++) {
      for (var i = -Math.ceil(R) - 1; i <= Math.ceil(R) + 1; i++) {
        var x = i + (j & 1 ? 0.5 : 0), y = j * 0.866;
        if (x * x + y * y <= R * R) SLOTS.push({ x: x, y: y, nb: [] });
      }
    }
    for (var a = 0; a < SLOTS.length; a++) {
      for (var b = 0; b < SLOTS.length; b++) {
        if (a === b) continue;
        var dx = SLOTS[a].x - SLOTS[b].x, dy = SLOTS[a].y - SLOTS[b].y;
        if (dx * dx + dy * dy < 1.1) SLOTS[a].nb.push(b);
      }
    }
    // Seven stem cells: one near the centre, six round a ring.
    var targets = [[0, 0]];
    for (var k = 0; k < 6; k++) {
      var ang = k * Math.PI / 3 + 0.3;
      targets.push([Math.cos(ang) * R * 0.58, Math.sin(ang) * R * 0.58]);
    }
    targets.forEach(function (t) {
      var best = 0, bd = 1e9;
      SLOTS.forEach(function (s, idx) {
        var d = (s.x - t[0]) * (s.x - t[0]) + (s.y - t[1]) * (s.y - t[1]);
        if (d < bd) { bd = d; best = idx; }
      });
      STEM_SLOTS.push(best);
    });
  })();
  var CAP = SLOTS.length - STEM_SLOTS.length;

  function Field(opts) {
    this.o = opts;
    this.t = 0;
    this.occ = new Array(SLOTS.length).fill(false);
    STEM_SLOTS.forEach(function (s) { this.occ[s] = true; }, this);
    this.cells = [];
    this.clones = [];
    this.stems = STEM_SLOTS.map(function (s) { return { slot: s, used: false, clone: -1 }; });
    this.lastAct = -999;
    this.history = [];
    this.samples = [];
    this.doses = [];
    this.flash = 0;
    this.colourIx = Math.floor(Math.random() * COLORS.length);
    if (opts.mode === "immortal") {
      this.activate(this.stems[0]);
      this.clones[0].budget = Infinity;
    }
    for (var i = 0; i < (opts.warm || 0); i++) this.tick(true);
  }

  Field.prototype.activate = function (stem) {
    var id = this.clones.length;
    this.clones.push({ color: COLORS[this.colourIx++ % COLORS.length], budget: Math.round(rnd(60, 95)), start: this.t });
    stem.used = true; stem.clone = id;
    this.lastAct = this.t;
    var free = SLOTS[stem.slot].nb.filter(function (n) { return !this.occ[n]; }, this);
    if (free.length) this.addCell(pick(free), id);
  };

  Field.prototype.addCell = function (slot, clone) {
    this.occ[slot] = true;
    this.cells.push({ slot: slot, clone: clone, age: 0, div: true,
      divAge: Math.round(rnd(7, 13)), life: Math.round(rnd(70, 110)), born: this.t });
    this.clones[clone].budget--;
  };

  Field.prototype.tick = function (silent) {
    var o = this.o, self = this;
    this.t++;
    var immortal = o.mode === "immortal";
    var cells = this.cells;

    // Division into a free neighbouring slot.
    var n = cells.length;
    for (var i = 0; i < n; i++) {
      var c = cells[i];
      c.age++;
      if (!c.div) continue;
      if (this.clones[c.clone].budget > 0 && Math.random() < 0.3) {
        var nb = SLOTS[c.slot].nb, free = [];
        for (var k = 0; k < nb.length; k++) if (!this.occ[nb[k]]) free.push(nb[k]);
        if (free.length) this.addCell(pick(free), c.clone);
      }
    }
    // Differentiation and death (not in the "immortal" picture).
    if (!immortal) {
      for (i = 0; i < cells.length; i++) {
        c = cells[i];
        if (c.div && (c.age > c.divAge || this.clones[c.clone].budget <= 0)) c.div = false;
      }
      this.cells = cells.filter(function (c) {
        if (c.age > c.life) { self.occ[c.slot] = false; return false; }
        return true;
      });
    }
    cells = this.cells;

    // A drug that only removes cells dividing at the moment of the dose.
    if (o.drug && this.t % 70 === 0) {
      var before = cells.length, killed = 0;
      this.cells = cells.filter(function (c) {
        if (c.div && Math.random() < 0.85) { self.occ[c.slot] = false; killed++; return false; }
        return true;
      });
      cells = this.cells;
      this.doses.push({ t: this.t, pct: before ? Math.round(100 * killed / before) : 0 });
      if (this.doses.length > 4) this.doses.shift();
      this.flash = 1;
    }

    // Close a clone whose cells are all gone.
    var counts = this.clones.map(function () { return 0; });
    var dividing = 0;
    cells.forEach(function (c) { counts[c.clone]++; if (c.div) dividing++; });
    this.clones.forEach(function (cl, id) {
      if (counts[id] === 0 && this.t - cl.start > 3) cl.budget = Math.min(cl.budget, 0);
    }, this);
    this.stems.forEach(function (s) {
      if (s.clone >= 0 && this.clones[s.clone].budget <= 0) s.clone = -1;
    }, this);

    // Next stem cell activates once the tissue has thinned out.
    if (!immortal) {
      var growing = this.clones.some(function (cl) { return cl.budget > 0; });
      if (!growing && cells.length < CAP * 0.5 && this.t - this.lastAct > 14) {
        var dormant = this.stems.filter(function (s) { return !s.used; });
        if (!dormant.length) { this.stems.forEach(function (s) { s.used = false; }); dormant = this.stems; }
        if (Math.random() < 0.25) this.activate(pick(dormant));
      }
    }

    // History for the strip: population by clone, and share dividing.
    this.history.push({ counts: counts, div: cells.length ? dividing / cells.length : 0, total: cells.length });
    if (this.history.length > 420) this.history.shift();
    if (o.sample && this.t % 85 === 0) {
      this.samples.push({ t: this.t, pct: Math.round(100 * (cells.length ? dividing / cells.length : 0)) });
    }
    this.samples = this.samples.filter(function (s) { return self.t - s.t < 420; });
    this.dividing = dividing;
  };

  Field.prototype.draw = function (ts) {
    var o = this.o;
    var stripH = o.strip ? Math.min(110, H * 0.22) : 0;
    var legendGap = 46;   // room for the caption under the disc
    var areaH = H - stripH - (o.strip ? 28 : 0) - legendGap - 30;
    legendEl.style.bottom = (o.strip ? stripH + 22 : 14) + "px";
    var cx = W / 2, cy = 30 + areaH / 2 + 6;
    var scale = Math.min(W * 0.9, areaH) / (2 * R + 1.2);
    ctx.clearRect(0, 0, W, H);

    // Tissue outline.
    ctx.beginPath();
    ctx.arc(cx, cy, (R + 0.7) * scale, 0, Math.PI * 2);
    ctx.fillStyle = o.tumour ? "#141a23" : "#121c1c";
    ctx.fill();
    ctx.strokeStyle = "#232c38"; ctx.lineWidth = 1; ctx.stroke();

    var pulse = 0.5 + 0.5 * Math.sin(ts / 260);
    var self = this;
    this.cells.forEach(function (c) {
      var s = SLOTS[c.slot], col = self.clones[c.clone].color;
      var x = cx + s.x * scale, y = cy + s.y * scale, r = scale * 0.4;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      var fade = Math.max(0.25, 1 - Math.max(0, c.age - c.life * 0.75) / (c.life * 0.25));
      if (c.div) {
        ctx.globalAlpha = 0.75 + 0.25 * pulse;
        ctx.fillStyle = col; ctx.fill();
        ctx.globalAlpha = 0.25 * pulse;
        ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, Math.PI * 2); ctx.fill();
      } else if (o.tumour) {
        // Tumour cells that did not finish differentiating: hollow, uneven.
        ctx.globalAlpha = 0.55 * fade;
        ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, r * 0.35); ctx.stroke();
      } else {
        ctx.globalAlpha = 0.45 * fade;
        ctx.fillStyle = col; ctx.fill();
      }
      ctx.globalAlpha = 1;
    });

    // Stem cells.
    this.stems.forEach(function (st) {
      var s = SLOTS[st.slot], x = cx + s.x * scale, y = cy + s.y * scale, r = scale * 0.5;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (st.clone >= 0) {
        ctx.strokeStyle = self.clones[st.clone].color; ctx.lineWidth = 2.5;
      } else {
        ctx.strokeStyle = "#8b949e"; ctx.lineWidth = 1.5;
        if (o.question) {
          ctx.globalAlpha = 0.4 + 0.6 * pulse;
          ctx.beginPath(); ctx.arc(x, y, r * (1.2 + 0.5 * pulse), 0, Math.PI * 2);
        }
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    });

    if (this.flash > 0) {
      ctx.globalAlpha = this.flash;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, (R + 0.7) * scale + (1 - this.flash) * 30, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      if (playing) this.flash = Math.max(0, this.flash - 0.04);
    }

    if (o.strip) this.drawStrip(16, H - stripH - 14, W - 32, stripH);
  };

  Field.prototype.drawStrip = function (x0, y0, w, h) {
    var hist = this.history, n = 420, clones = this.clones;
    ctx.fillStyle = "#0f151d"; ctx.fillRect(x0, y0, w, h);
    ctx.strokeStyle = "#232c38"; ctx.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, h - 1);
    var bw = w / n, off = n - hist.length;
    hist.forEach(function (hrow, i) {
      var y = y0 + h;
      hrow.counts.forEach(function (cnt, id) {
        if (!cnt) return;
        var bh = (cnt / CAP) * (h - 6);
        ctx.fillStyle = clones[id].color; ctx.globalAlpha = 0.7;
        ctx.fillRect(x0 + (off + i) * bw, y - bh, Math.ceil(bw), bh);
        y -= bh;
      });
    });
    ctx.globalAlpha = 1;
    // Share of cells dividing, as a white line.
    // Skip moments with only a handful of cells, where a share is meaningless.
    ctx.beginPath();
    var penUp = true;
    hist.forEach(function (hrow, i) {
      if (hrow.total < 12) { penUp = true; return; }
      var x = x0 + (off + i) * bw, y = y0 + h - 3 - hrow.div * (h - 10);
      if (penUp) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      penUp = false;
    });
    ctx.strokeStyle = "rgba(230,237,243,0.75)"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.font = "11px Menlo, monospace"; ctx.fillStyle = "#8b949e";
    ctx.fillText("cells by family over time   white line: share dividing", x0 + 6, y0 + 13);
    var t = this.t;
    this.samples.forEach(function (s) {
      var x = x0 + w - (t - s.t) * bw;
      ctx.strokeStyle = "#ffd166"; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x, y0 + 18); ctx.lineTo(x, y0 + h); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#ffd166"; ctx.fillText(s.pct + "%", x + 3, y0 + 28);
    });
    this.doses.forEach(function (d) {
      var x = x0 + w - (t - d.t) * bw;
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x - 1, y0 + 16, 2, h - 16);
    });
  };

  Field.prototype.readout = function () {
    var o = this.o;
    if (o.mode === "immortal") return "cells: " + this.cells.length + " of " + CAP + ", all still dividing";
    if (o.drug) {
      if (!this.doses.length) return "waiting for the first dose";
      return "share of tumour removed by each dose: " + this.doses.map(function (d) { return d.pct + "%"; }).join("  ");
    }
    if (o.sample) {
      var last = this.samples.slice(-4).map(function (s) { return s.pct + "%"; });
      return last.length ? "samples, share dividing: " + last.join("  ") : "taking samples";
    }
    if (o.quiet) return "";
    var growing = this.clones.filter(function (c) { return c.budget > 0; }).length;
    return "families so far: " + this.clones.length + "   cells dividing now: " + (this.dividing || 0) +
      (growing ? "" : "   (waiting for the next stem cell)");
  };

  /* ---------- Ovary simulation ---------- */

  function Ovary() { this.cycles = 0; this.twins = 0; this.newCycle(); }
  Ovary.prototype.newCycle = function () {
    this.f = 0.25; this.e2 = 0; this.phase = "rise"; this.timer = 0;
    this.fol = [];
    for (var i = 0; i < 14; i++) this.fol.push({ size: rnd(0.8, 1.05), sel: false, alive: 1, a: i / 14 * Math.PI * 2 + rnd(-0.12, 0.12) });
  };
  Ovary.prototype.tick = function () {
    var TH = 0.6;
    var selected = this.fol.filter(function (f) { return f.sel; });
    if (this.phase === "rise" || this.phase === "select") {
      // Feedback strength tuned so about 1 cycle in 100 picks two (measured over 4,000 runs).
      this.e2 = Math.min(1, this.e2 + 1.0 * selected.length);
      this.f = Math.max(0.05, Math.min(1, this.f + 0.006 - 0.12 * this.e2));
      if (this.f >= TH) {
        var cands = this.fol.filter(function (f) { return !f.sel; });
        if (cands.length && Math.random() < 0.12) { pick(cands).sel = true; this.phase = "select"; }
      }
      var self = this;
      this.fol.forEach(function (fo) {
        if (fo.sel) fo.size = Math.min(2.4, fo.size + 0.03);
        else if (self.phase === "select" && self.f < TH) fo.alive = Math.max(0, fo.alive - 0.025);
      });
      if (selected.length && selected.every(function (f) { return f.size >= 2.4; })) {
        this.phase = "ovulate"; this.timer = 0; this.cycles++;
        if (selected.length > 1) this.twins++;
      }
    } else if (this.phase === "ovulate") {
      this.timer++;
      if (this.timer > 22) this.newCycle();
    }
  };
  Ovary.prototype.draw = function (ts) {
    legendEl.style.bottom = "14px";
    ctx.clearRect(0, 0, W, H);
    var TH = 0.6;
    var barW = 26, barX = W - 60, barY = 50, barH = H - 110;
    var cx = (W - 80) / 2 + 10, cy = H / 2 + 4;
    var rad = Math.min(cx - 30, (H - 90) / 2) * 0.72;
    var unit = rad * 0.13;
    ctx.beginPath(); ctx.ellipse(cx, cy, rad * 1.32, rad * 1.22, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#16141c"; ctx.fill(); ctx.strokeStyle = "#232c38"; ctx.stroke();
    var self = this;
    this.fol.forEach(function (fo) {
      var x = cx + Math.cos(fo.a) * rad, y = cy + Math.sin(fo.a) * rad * 0.9;
      var r = unit * fo.size * (fo.sel ? 1 : (0.5 + 0.5 * fo.alive));
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      if (fo.sel) {
        ctx.fillStyle = "#f72585"; ctx.globalAlpha = 0.85; ctx.fill();
        if (self.phase === "ovulate") {
          ctx.globalAlpha = 1 - self.timer / 22; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x, y, r + self.timer * 2, 0, Math.PI * 2); ctx.stroke();
        }
      } else {
        ctx.globalAlpha = 0.25 + 0.6 * fo.alive; ctx.strokeStyle = "#b892ff"; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });
    // FSH bar.
    ctx.fillStyle = "#0f151d"; ctx.fillRect(barX, barY, barW, barH);
    ctx.strokeStyle = "#232c38"; ctx.strokeRect(barX + 0.5, barY + 0.5, barW - 1, barH - 1);
    var fh = this.f * barH;
    ctx.fillStyle = this.f >= TH ? "#ffd166" : "#4cc9f0";
    ctx.fillRect(barX + 3, barY + barH - fh, barW - 6, fh);
    var ty = barY + barH - TH * barH;
    ctx.setLineDash([4, 3]); ctx.strokeStyle = "#e6edf3";
    ctx.beginPath(); ctx.moveTo(barX - 8, ty); ctx.lineTo(barX + barW + 6, ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = "11px Menlo, monospace"; ctx.fillStyle = "#8b949e"; ctx.textAlign = "center";
    ctx.fillText("FSH", barX + barW / 2, barY - 10);
    ctx.fillText("oestradiol " + Math.round(this.e2 * 100) + "%", barX + barW / 2 - 14, barY + barH + 22);
    ctx.textAlign = "left";
  };
  Ovary.prototype.readout = function () {
    return "cycles: " + this.cycles + "   two picked at once: " + this.twins;
  };

  /* ---------- Scene control ---------- */

  var el = function (id) { return document.getElementById(id); };
  var legendEl = el("legend");
  var dots = el("dots");
  SCENES.forEach(function (_, i) {
    var d = document.createElement("div");
    d.className = "dot"; d.title = "Step " + (i + 1);
    d.addEventListener("click", function () { go(i); });
    dots.appendChild(d);
  });

  function go(i) {
    current = Math.max(0, Math.min(SCENES.length - 1, i));
    var s = SCENES[current];
    el("step").textContent = (current + 1) + " / " + SCENES.length;
    el("title").textContent = s.title;
    el("body").innerHTML = s.body;
    el("tag").textContent = s.tag;
    el("legend").textContent = s.legend;
    el("prev").disabled = current === 0;
    el("next").disabled = current === SCENES.length - 1;
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle("on", k === current); });
    sim = s.sim.mode === "ovary" ? new Ovary() : new Field(s.sim);
    if (!playing) { for (var k = 0; k < 60; k++) sim.tick(true); }
    el("readout").textContent = sim.readout();
  }

  /* ---------- Optional narration (device speech, no network) ---------- */

  var speech = window.speechSynthesis;
  var narrating = false, narrationId = 0, advanceTimer = null;
  var narrateBtn = el("narrate");
  if (!speech || typeof SpeechSynthesisUtterance === "undefined") narrateBtn.style.display = "none";

  function pickVoice() {
    var voices = speech.getVoices();
    var prefs = ["en-NZ", "en-GB", "en-AU", "en-IE", "en"];
    for (var i = 0; i < prefs.length; i++) {
      var v = voices.filter(function (x) { return x.lang && x.lang.replace("_", "-").indexOf(prefs[i]) === 0; });
      if (v.length) return v.filter(function (x) { return x.localService; })[0] || v[0];
    }
    return null;
  }

  // Turns the visible step into something that reads well aloud.
  function scriptFor(i) {
    var holder = document.createElement("div");
    holder.innerHTML = SCENES[i].body;
    Array.prototype.forEach.call(holder.querySelectorAll("cite"), function (c) {
      c.textContent = " (" + c.textContent.replace(/p\.\s*/g, "page ").replace(/,\s*page/, ", page") + ").";
    });
    var text = SCENES[i].title + ". " + holder.textContent.replace(/\u2026/g, ", ").replace(/\s+/g, " ");
    // Short sentences avoid browsers cutting long utterances off part way.
    return text.match(/[^.!?]+[.!?)]+["']?|\S[^.!?]*$/g) || [text];
  }

  function stopSpeech() {
    narrationId++;
    clearTimeout(advanceTimer);
    if (speech) speech.cancel();
  }

  function narrate(i) {
    stopSpeech();
    var id = narrationId, parts = scriptFor(i), voice = pickVoice();
    parts.forEach(function (p, k) {
      var u = new SpeechSynthesisUtterance(p.trim());
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      u.rate = 0.95;
      if (k === parts.length - 1) {
        u.onend = function () {
          if (id !== narrationId || !narrating) return;
          if (current < SCENES.length - 1) advanceTimer = setTimeout(function () { go(current + 1); }, 2500);
          else setNarrating(false);
        };
      }
      speech.speak(u);
    });
  }

  function setNarrating(on) {
    narrating = on;
    narrateBtn.textContent = on ? "Stop narration" : "Narrate";
    narrateBtn.setAttribute("aria-pressed", on ? "true" : "false");
    if (on) narrate(current); else stopSpeech();
  }
  narrateBtn.addEventListener("click", function () { setNarrating(!narrating); });
  if (speech && speech.onvoiceschanged !== undefined) speech.onvoiceschanged = function () {};

  var baseGo = go;
  go = function (i) {
    baseGo(i);
    if (narrating) narrate(current);
  };

  el("prev").addEventListener("click", function () { go(current - 1); });
  el("next").addEventListener("click", function () { go(current + 1); });
  el("play").addEventListener("click", togglePlay);
  function togglePlay() {
    playing = !playing;
    el("play").textContent = playing ? "Pause" : "Play";
    el("play").setAttribute("aria-label", playing ? "Pause animation" : "Play animation");
  }
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(current + 1);
    else if (e.key === "ArrowLeft") go(current - 1);
    else if (e.key === " ") { e.preventDefault(); togglePlay(); }
  });
  window.addEventListener("resize", fit);

  var last = 0, acc = 0;
  function frame(ts) {
    var dt = Math.min(250, ts - (last || ts)); last = ts;
    if (playing) {
      acc += dt;
      var stepMs = sim instanceof Ovary ? 90 : 110;
      while (acc >= stepMs) { sim.tick(false); acc -= stepMs; }
      el("readout").textContent = sim.readout();
    }
    sim.draw(playing ? ts : 0);
    requestAnimationFrame(frame);
  }

  el("play").textContent = playing ? "Pause" : "Play";
  fit();
  go(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
